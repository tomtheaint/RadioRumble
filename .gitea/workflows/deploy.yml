name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: git.lab.theislan.com
  IMAGE: git.lab.theislan.com/tom/radiorumble

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Clone repository
        run: |
          rm -rf src
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_TOKEN }}@${{ env.REGISTRY }}/tom/RadioRumble.git" src
          cd src && git rev-parse --short HEAD > /tmp/sha

      - name: Log in to registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login ${{ env.REGISTRY }} -u ${{ secrets.REGISTRY_USER }} --password-stdin

      - name: Build and push
        run: |
          SHA=$(cat /tmp/sha)
          cd src
          # --progress=plain because the default renderer redraws the whole
          # step list on every tick, and a log file cannot redraw -- it just
          # accumulates. One cancelled build here wrote 12,078 lines, each step
          # repeated 813 times, which reads exactly like a build going in
          # circles. It was one slow layer, but the log could not say so.
          #
          # Detected rather than assumed: the flag is BuildKit-only and the
          # legacy builder rejects it outright with "unknown flag", which would
          # turn DOCKER_BUILDKIT=0 -- the escape hatch when BuildKit corrupts
          # itself -- into a build that cannot start at all.
          PROGRESS=""
          if docker build --help 2>&1 | grep -q -- "--progress"; then
            PROGRESS="--progress=plain"
          fi
          docker build $PROGRESS -t ${{ env.IMAGE }}:$SHA -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:$SHA
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # BatchMode matters more than it looks. Without it, a key the
          # server will not accept falls through to ssh offering password
          # authentication, and on a runner with no terminal that waits for
          # input which never comes — the job hangs holding the only runner
          # until somebody kills it by hand, rather than failing in a second
          # with a legible error. ConnectTimeout covers the same shape of
          # problem at the network level.
          ssh -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            deploy@10.20.20.60 radiorumble

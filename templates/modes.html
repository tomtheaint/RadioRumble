<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Radio Rumble — The games</title>
<style>
  :root {
    --bg:#0b0e14; --panel:#141922; --panel-2:#1b212c; --line:#263042;
    --text:#e8edf5; --muted:#8b97ad; --dim:#5d6980; --live:#3fd07f; --bad:#ff8080;
    --warm:#ffb347;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:20px 16px 80px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center;
           padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  h1 { font-size:20px; margin:0; }
  a.back { color:#4da3ff; text-decoration:none; font-size:13px; }
  a.back:hover { text-decoration:underline; }
  a.back.first { margin-left:auto; }

  .intro { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .intro b { color:var(--text); }

  .game { border:1px solid var(--line); border-radius:12px; background:var(--panel);
          padding:18px 20px; margin-bottom:14px; }
  .game.active { border-color:var(--live); }
  .game h2 { font-size:18px; margin:0 0 2px; display:flex; align-items:center;
             gap:10px; flex-wrap:wrap; }
  .summary { font-size:15px; color:var(--text); margin:6px 0 0; }
  .detail { color:var(--muted); font-size:13.5px; margin:10px 0 0; }

  .objective { margin:14px 0 0; padding:10px 14px; border-left:3px solid #3b6ea5;
               background:var(--panel-2); border-radius:0 8px 8px 0;
               font-size:14px; }
  .objective b { color:#7fb3e8; display:block; font-size:11px; text-transform:uppercase;
                 letter-spacing:.08em; margin-bottom:2px; font-weight:600; }

  .pill { font-size:10px; text-transform:uppercase; letter-spacing:.07em;
          padding:2px 8px; border-radius:999px; border:1px solid var(--line);
          color:var(--muted); font-weight:600; }
  .pill.live { border-color:var(--live); color:var(--live); }
  .pill.default { border-color:var(--warm); color:var(--warm); }

  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }
  th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.07em;
       color:var(--dim); padding:6px 10px 6px 0; border-bottom:1px solid var(--line);
       font-weight:600; }
  td { padding:8px 10px 8px 0; border-bottom:1px solid var(--line);
       vertical-align:top; color:var(--muted); }
  td.k { color:var(--text); font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
         font-size:12.5px; white-space:nowrap; }
  td.v { color:#7fb3e8; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
         font-size:12.5px; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  .none { color:var(--dim); font-size:13px; margin-top:12px; font-style:italic; }

  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.08em;
       color:var(--muted); margin:30px 0 10px; font-weight:600; }
  .note { color:var(--dim); font-size:12.5px; margin-top:10px; }
  .note code { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The games</h1>
    <a class="back first" href="./">← scoreboard</a>
    <a class="back" href="./matches">matches</a>
    <a class="back" href="./check">check page</a>
  </header>

  <p class="intro" id="intro"></p>

  <div id="games"></div>

  <h3>Settings shared by every game</h3>
  <div class="game"><div id="shared"></div></div>

  <h3>Bonuses</h3>
  <div class="game"><div id="bonuses"></div></div>
</div>

<script>
"use strict";

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function optionTable(rows, keyName, valName) {
  var t = el("table");
  var head = el("tr");
  head.append(el("th", null, keyName), el("th", null, valName), el("th", null, "what it does"));
  t.append(head);
  rows.forEach(function (r) {
    var tr = el("tr");
    tr.append(el("td", "k", r.name),
              el("td", "v", String(r.value)),
              el("td", null, r.about));
    t.append(tr);
  });
  return t;
}

function gameCard(g) {
  var card = el("div", "game" + (g.active ? " active" : ""));

  var h = el("h2");
  h.append(document.createTextNode(g.label));
  if (g.active) h.append(el("span", "pill live", "being played"));
  else if (g.default) h.append(el("span", "pill default", "contest default"));
  card.append(h);

  card.append(el("p", "summary", g.summary));
  (g.detail || []).forEach(function (p) { card.append(el("p", "detail", p)); });

  var obj = el("div", "objective");
  obj.append(el("b", null, "Objective"), document.createTextNode(g.objective));
  card.append(obj);

  /* The value column is what this contest is set to, not the documented
     default -- somebody reading the page to find out how tonight is scored is
     asking about the former. They differ more often than not. */
  if (g.options.length) {
    card.append(optionTable(g.options.map(function (o) {
      return { name: o.name, value: g.settings[o.name], about: o.about };
    }), "option", g.default ? "in force" : "default"));
  } else {
    card.append(el("p", "none", "No settings of its own."));
  }
  return card;
}

fetch("./api/modes")
  .then(function (r) { return r.json(); })
  .then(function (data) {
    var active = data.games.filter(function (g) { return g.active; })[0];
    document.getElementById("intro").innerHTML =
      "Six games over the same log. The teams, the clock, the bands and the " +
      "dupe rules never change — only what a contact is <b>worth</b>. " +
      (active ? "Right now this contest is playing <b>" + active.label + "</b>." : "");

    var host = document.getElementById("games");
    data.games.forEach(function (g) { host.append(gameCard(g)); });

    document.getElementById("shared").append(
      optionTable(data.shared.map(function (s) {
        return { name: s.name, value: Array.isArray(s.value) ? s.value.join(", ") : s.value,
                 about: s.about };
      }), "setting", "in force"));

    var b = document.getElementById("bonuses");
    if (!data.bonuses.enabled) {
      b.append(el("p", "none", "Bonuses are switched off for this contest."));
    } else {
      b.append(optionTable(data.bonuses.items, "bonus", "points"));
      b.append(el("p", "note",
        "A bonus set to 0 is off. They stack: one contact can earn several."));
    }

    document.querySelector(".wrap").append(
      Object.assign(el("p", "note"), {
        innerHTML: "Every value above comes from <code>contest.toml</code> on the " +
                   "server. A match can also name its own game, which overrides the " +
                   "contest default while it is running — see the matches page."
      }));
  })
  .catch(function (err) {
    document.getElementById("intro").textContent = "Could not load the games: " + err.message;
  });
</script>
</body>
</html>

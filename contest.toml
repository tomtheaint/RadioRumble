#  Radio Rumble — contest definition
#
#  Everything that decides a score lives here. Adding a school means adding a
#  [[teams]] block; it never means editing Python.

[contest]
name = "Radio Rumble"

#  Which game is being played. Same log, same teams, same clock — only the
#  question of what a contact is worth changes.
#
#    "classic"   points x grid squares. Work more, and work more places.
#    "conquest"  a map of the United States. Work a station in a state and
#                your school owns it, coloured in. Score is territory held.
#    "dx"        only contacts outside the US count, scored by how many
#                countries you reach. Drawn on a globe.
#    "scarcity"  the rarer the contact, the more it is worth.
#    "connect"   reach a named target.
#    "traverse"  cross the map from one side to the other.
#
#  This is the contest's default. A single match may override it -- see the
#  schedule below -- so a season can play conquest one week and dx the next.
#
#  Settings for each live in the [classic] / [conquest] / [dx] tables below.
mode = "conquest"

#  The clock. Both are UTC. Leave them commented out and every QSO in the log
#  counts, which is what you want while testing — the shipped mock log would
#  otherwise fall outside any window you picked today.
#
#  Set them for the real event. A collegiate rumble wants to be short enough
#  to watch end to end: two hours is a long enough run for band changes to
#  matter and short enough that nobody drifts away.
#
# start = 2026-09-12T18:00:00Z
# end   = 2026-09-12T20:00:00Z

#  Where the QSOs come from. Point this at the ADIF your logger writes, or at
#  the transcript rec.py produces — both parse. WSJT-X writes wsjtx_log.adi in
#  its log directory; N1MM and friends can export continuously to ADIF.
log_file = "mock_contest_log.txt"

#  Bands and modes that count. An empty list means "anything".
bands = ["80m", "40m", "20m", "15m", "10m"]
modes = ["FT8", "FT4"]

#  Points per contact. Kept at one so the multiplier is what separates teams:
#  everybody can grind QSOs, but only a team that moves around collects grids.
qso_points = 1

#  What counts as working the same station twice.
#    "band"       once per band  (default — rewards changing bands)
#    "band-mode"  once per band and mode  (FT8 and FT4 on 20m are separate)
#    "contest"    once, full stop
dupe_scope = "band"

#  Who is competing against whom.
#    "team"      schools against each other, rosters as written below
#    "operator"  every rostered callsign becomes its own entry, for a club's
#                internal contest. Still needs everyone listed in advance.
#    "open"      a free-for-all. No roster at all: anybody whose log reaches
#                the server is entered, from the moment it does. Teams listed
#                below are still honoured — they are pre-registered entrants
#                with a name and colours somebody chose — and everybody else
#                is admitted on arrival, which is how a club night or anything
#                advertised on a repeater actually works: you find out who
#                entered by seeing who turns up.
compete_as = "team"

#  How many rows the scoreboard shows. The rest of the field is still scored,
#  still holds territory and still counts towards every total on the page —
#  only the list is shortened, because the list is what gets pushed down a
#  websocket every time the log grows. Three thousand callsigns is 1.4MB a
#  time; fifteen is four.
#
#  Everybody below the cut can still find themselves: /api/standings serves
#  the whole table, searchable, and the page asks for it only when somebody
#  does. Set to 0 to send everyone, which is fine for a handful of schools.
standings_limit = 15

#  A directory of submitted logs, one file per entrant, instead of the
#  single file above. This is what makes cross-checking possible: a
#  contact can only be confirmed against the other operator's own log.
#  Generate a set with: python createLog.py --split logs
log_dir = "logs"

#  How far two logs may disagree about when a contact happened and still
#  be treated as the same contact. Clocks drift and loggers round
#  differently; an FT8 exchange takes about a minute end to end.
match_minutes = 3


#  ---------------------------------------------------------------------------
#  Scoring modifiers. Every one is optional and they stack. Nothing is on by
#  default except the DX bonus -- a modifier nobody asked for that quietly
#  changes a score is worse than no modifier at all.
#
#  Values are read out of the log itself: TX_PWR for QRP, SIG/COMMENT for park
#  and summit references, MODE for FT4, BAND for the Technician allocations.
#  ---------------------------------------------------------------------------

[bonuses]
enabled = true

dx = 2                 # extra points for a contact outside the home country
qrp = 0                # the other station logged 20 W or less
qrp_watts = 20
pota_sota = 0          # POTA/SOTA/WWFF/IOTA named in the log
special_event = 0      # a callsign listed in special_calls below
technician_band = 0    # 10m, 6m, 2m, 1.25m, 70cm
ft4_multiplier = 1.0   # 0.5 makes an FT4 contact worth half an FT8 one

#  Deducted when the other operator submitted a log and this contact is not
#  in it. Deliberately harsher than simply losing the contact: guessing at a
#  half-copied callsign should cost more than not logging it at all.
nil_penalty = 0

special_calls = []


#  ---------------------------------------------------------------------------
#  The schedule. Entirely optional.
#
#  Leave it out and every team counts as playing today, which is what a
#  one-off event means. Write it and the roll call on /check shows only the
#  schools actually expected at the radio that afternoon — listing forty teams
#  when four are playing is as useless as listing none.
#
#    [[matches]]
#    date  = 2026-09-12          # the day it is played on
#    teams = ["KU", "KSU"]       # abbreviations, as in [[teams]] below
#    label = "Week 1"            # shown on the roll call
#    mode  = "dx"                # optional; the contest's own game if omitted
#
#  Use start/end instead of date when a day is not precise enough:
#
#    [[matches]]
#    start = 2026-09-12T18:00:00Z
#    end   = 2026-09-12T20:00:00Z
#    teams = ["NEB", "ISU"]
#
#  Matches can also be added from /matches in the browser, which stores them in
#  the database rather than here. The two are merged, so a season written into
#  this file and a match typed in on the night both count -- and this file is
#  never rewritten by the app, so these comments survive.
#
#  A free-for-all is a match with nobody named in it. Naming no teams says
#  the same thing as open = true, because a match with nobody in it can only
#  mean everybody:
#
#    [[matches]]
#    date  = 2026-09-19
#    open  = true
#    label = "Open night"
#  ---------------------------------------------------------------------------


#  ---------------------------------------------------------------------------
#  The WSJT-X listener.
#
#  Operators point WSJT-X at this machine under Reporting -> UDP Server, and
#  every contact they log arrives here as a datagram and is written straight
#  into the log directory. Several instances can report to one server, which
#  is what a multi-operator team wants.
#
#  Run by the server so it can be seen. rec.py still does the same job from a
#  terminal, which is fine until the terminal is on a laptop behind a table
#  and nobody can tell whether it is still alive.
#  ---------------------------------------------------------------------------

[listener]
enabled = true         # start it with the server
host = "0.0.0.0"       # every interface, so operators on the venue wifi reach it

#  Both of WSJT-X's reporting servers, because operators can only spare one of
#  them and it is rarely the same one twice.
#
#    2237  "UDP Server" — the whole protocol, including the heartbeat that
#          lets somebody be seen setting up. Usually already taken on the
#          operator's machine by JTAlert or GridTracker.
#    2333  "Secondary UDP Server" — tick "Enable logged contact ADIF
#          broadcast". One ADIF record per contact and nothing else, so a
#          station on this one is not seen until it works somebody. Deprecated
#          by WSJT-X, and still the field most operators have free.
#
#  Which shape a datagram is decided by what is in it, not by the port it
#  arrived on, so an operator who puts the wrong one in the wrong box is still
#  understood.
ports = [2237, 2333]

#  One file per station callsign inside log_dir, which is what cross-checking
#  needs. False writes everything into the contest's single log_file instead.
split = true


#  ---------------------------------------------------------------------------
#  Per-mode settings. Only the table matching `mode` above is read.
#  ---------------------------------------------------------------------------

[conquest]
#  Who holds a state.
#    "first"  whoever gets there first keeps it. Rewards speed, and the map
#             stops moving once it fills up.
#    "most"   whoever has the most contacts into it, ties going to whoever
#             claimed it first. States change hands all afternoon — this is
#             the version that behaves like a game.
claim = "first"
#  Which board it is played on.
#    "state"  51 pieces. Borders everyone can picture, and a contact often
#             claims two at once because a grid square is bigger than a state
#             line. A short, fast game — the map fills up inside an hour.
#    "grid"   683 squares. Each contact claims exactly one, so there is no
#             ambiguity and no free second state; the game is far longer and
#             far more about coverage than about luck.
#             Note that 207 of the 683 are Alaska, so a team that can work
#             Alaska has a lot of board available to it.
territory = "grid"     # "state" (51 pieces) or "grid" (683 squares)

#  How much of the country is on the grid board. Ignored on the state board.
#    "conus"  the lower 48, 469 squares. Every one is reachable in a short
#             contest and legible on the map, so the fraction held means
#             something.
#    "all"    683 squares. Alaska alone is 207 of them -- 30% of the board,
#             nearly all of it sea nobody will work in two hours.
#  Narrowing the board never costs anyone a contact: an Alaskan station still
#  scores, it just doesn't take a square.
extent = "conus"       # "conus" (469) or "all" (683, includes AK and HI)

[dx]
#  A DX contact is worth more than a domestic one is in classic mode, because
#  there are far fewer of them to be had in two hours.
points_per_dx = 3

#  Set true to let domestic contacts score too, at the ordinary qso_points,
#  while countries still drive the multiplier.
count_domestic = false

[scarcity]
#  Conquest, but the last states standing are the valuable ones. Every state
#  starts at base_points; each one claimed makes the remaining ones worth
#  step_points more. Rhode Island at minute five is worth the same as Texas,
#  and at minute fifty it is worth several times as much.
#
#  The price is locked in when the state is claimed, so banking one early
#  keeps its early price -- the reward is for going and getting the awkward
#  ones while they are still awkward.
base_points = 10
step_points = 5
#  Which board it is played on.
#    "state"  51 pieces. Borders everyone can picture, and a contact often
#             claims two at once because a grid square is bigger than a state
#             line. A short, fast game — the map fills up inside an hour.
#    "grid"   683 squares. Each contact claims exactly one, so there is no
#             ambiguity and no free second state; the game is far longer and
#             far more about coverage than about luck.
#             Note that 207 of the 683 are Alaska, so a team that can work
#             Alaska has a lot of board available to it.
territory = "state"    # "state" (51 pieces) or "grid" (683 squares)

#  How much of the country is on the grid board. Ignored on the state board.
#    "conus"  the lower 48, 469 squares. Every one is reachable in a short
#             contest and legible on the map, so the fraction held means
#             something.
#    "all"    683 squares. Alaska alone is 207 of them -- 30% of the board,
#             nearly all of it sea nobody will work in two hours.
#  Narrowing the board never costs anyone a contact: an Alaskan station still
#  scores, it just doesn't take a square.
extent = "conus"       # "conus" (469) or "all" (683, includes AK and HI)

[connect]
#  Territory only counts when it touches territory you already hold. Twelve
#  scattered states are worth nothing; four in a row are worth everything.
#  Score is the largest unbroken run; reaching `target` wins outright.
target = 4
territory = "state"    # "state" (51 pieces) or "grid" (683 squares)

#  How much of the country is on the grid board. Ignored on the state board.
#    "conus"  the lower 48, 469 squares. Every one is reachable in a short
#             contest and legible on the map, so the fraction held means
#             something.
#    "all"    683 squares. Alaska alone is 207 of them -- 30% of the board,
#             nearly all of it sea nobody will work in two hours.
#  Narrowing the board never costs anyone a contact: an Alaskan station still
#  scores, it just doesn't take a square.
extent = "conus"       # "conus" (469) or "all" (683, includes AK and HI)

[traverse]
#  Cross the country with an unbroken chain of held states.
#    "east-west"    Pacific to Atlantic  -- 7 states at the very least
#    "north-south"  Canada to the Gulf   -- 3 at the very least
axis = "east-west"
crossing_points = 1000

#  Where a crossing starts and stops. Declared rather than computed: it is a
#  rules decision, and every geometric rule that looks reasonable puts the
#  District of Columbia on all four sides of the country. Defaults live in
#  static/adjacency.json; uncomment to override.
# [traverse.edges]
# west = ["California", "Oregon", "Washington"]
# east = ["Maine", "New Hampshire", "Massachusetts"]


#  ---------------------------------------------------------------------------
#  Teams. `callsigns` lists the station callsigns your operators log under —
#  the <station_callsign> field, not the stations they work. A QSO logged by a
#  callsign that appears on no roster is ignored, which is what keeps the rest
#  of the world out of a collegiate scoreboard.
#
#  Colours are the school's, and they are used for the bars on the scoreboard.
#  ---------------------------------------------------------------------------

[[teams]]
name = "Kansas State University"
abbr = "KSU"
color = "#512888"
callsigns = ["KE0VUM"]
grid = "EM19"
description = "The K-State Amateur Radio Club, operating from Manhattan."
gear = "IC-7300 into a 40m dipole at 30 ft"
members = ["Tom", "Alex", "Priya"]
website = "https://www.k-state.edu/"
